<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeritArc Admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<main>
  <header><a href="/">MeritArc</a><span>Administrator Console</span></header>
  <section id="loginPanel" class="admin-login">
    <h1>Admin Sign In</h1><p>Use the administrator credentials configured for this MeritArc deployment.</p>
    <form id="loginForm"><input id="loginEmail" type="email" placeholder="Admin email" required autocomplete="username"><input id="loginPassword" type="password" placeholder="Admin password" required autocomplete="current-password"><button>Sign In</button><p id="loginMessage" class="message"></p></form>
  </section>
  <section id="adminPanel" hidden>
    <div class="bar"><div><h1>Question Bank</h1><p id="adminUser" class="muted"></p></div><div><button id="new">+ Add Question</button> <button id="logout">Sign Out</button></div></div>
    <p id="status"></p>
    <div class="filters"><input id="search" placeholder="Search question"><select id="subject"><option value="">All subjects</option></select><select id="difficulty"><option value="">All difficulties</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
    <section id="panel" hidden><form id="form"><input type="hidden" id="id"><input id="fs" placeholder="Subject" required><input id="ft" placeholder="Topic" required><select id="fd"><option>Easy</option><option>Medium</option><option>Hard</option></select><textarea id="fq" placeholder="Question" required></textarea><input id="a" placeholder="Option A" required><input id="b" placeholder="Option B" required><input id="c" placeholder="Option C" required><input id="d" placeholder="Option D" required><select id="correct"><option value="0">Correct A</option><option value="1">Correct B</option><option value="2">Correct C</option><option value="3">Correct D</option></select><input id="ex" placeholder="Explanation"><button>Save</button><button type="button" id="cancel">Cancel</button></form></section>
    <table><thead><tr><th>ID</th><th>Subject</th><th>Topic</th><th>Difficulty</th><th>Question</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</main><script src="admin.js"></script></body></html>
