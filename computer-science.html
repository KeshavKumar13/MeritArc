<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeritArc | Computer Science & Programming</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="category.css"><link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head><body data-group="Computer Science & Programming"><header class="site-header"><a class="brand" href="/" aria-label="MeritArc Home"><img src="assets/logo.svg" alt="MeritArc"></a><button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="nav" id="siteNav"><button onclick="location.href='/'">Home</button><button onclick="location.href='/#assessment'">Assessments</button><button onclick="location.href='/#results'">Results</button><button onclick="location.href='support.html'">Support</button><button onclick="location.href='/?auth=1'">Sign In</button></nav></header><main class="container category-page"><section class="category-hero"><span class="pill">MeritArc Assessments</span><h1 id="categoryTitle"></h1><p id="categoryDescription" class="muted"></p><div id="subjectCount" class="tag"></div></section><section id="categoryGrid" class="category-grid"></section></main><footer class="site-footer">MeritArc • Practice smarter. Build skills. Track progress. • <a href="support.html">Support & Contact</a></footer><script src="js/data.js"></script><script src="category.js"></script><script>const menu=document.getElementById("siteNav"),menuBtn=document.getElementById("mobileMenuButton");menuBtn.addEventListener("click",e=>{e.stopPropagation();const o=menu.classList.toggle("open");menuBtn.setAttribute("aria-expanded",String(o));});document.querySelectorAll("#siteNav button").forEach(b=>b.addEventListener("click",()=>menu.classList.remove("open")));document.addEventListener("pointerdown",e=>{if(menu.classList.contains("open")&&!menu.contains(e.target)&&!menuBtn.contains(e.target)){menu.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");}});</script></body></html>
